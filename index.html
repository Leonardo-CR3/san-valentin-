<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Carta */
.carta {
    width: 200px;
    height: 150px;
    background: white;
    position: relative;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.5s;
}

.carta:hover {
    transform: scale(1.1);
}

.carta::before {
    content: "💌";
    font-size: 50px;
}

/* Mensaje oculto */
.mensaje {
    position: absolute;
    width: 80%;
    max-width: 400px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* Corazones */
.corazon {
    position: absolute;
    font-size: 20px;
    animation: flotar linear infinite;
}

@keyframes flotar {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="carta" onclick="abrirCarta()"></div>

<div class="mensaje" id="mensaje">
    <h2>Feliz 1 Mes 💘</h2>
    <p>
        Gracias por este mes tan bonito contigo 🥺💖  
        Cada momento a tu lado es especial  
        y quiero seguir viviendo muchos más contigo 😏💘
    </p>
</div>

<script>
function abrirCarta() {
    document.querySelector(".carta").style.display = "none";
    document.getElementById("mensaje").style.display = "block";
}

// corazones flotando
function crearCorazon() {
    const corazon = document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML = "💖";
    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 6000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
