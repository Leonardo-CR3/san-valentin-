<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>San Valentín 💘</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    h1 {
        font-size: 45px;
        color: white;   
        animation: latido 1s infinite alternate;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    @keyframes latido {
        from { transform: scale(1); }
        to { transform: scale(1.1); }
    }

    .flores {
        font-size: 50px;
        margin-bottom: 10px;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        position: absolute;
        transition: 0.2s;
    }

    #si {
        background-color: #ff4d6d;
        color: white;
        left: 40%;
        top: 65%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #no {
        background-color: #444;
        color: white;
        left: 55%;
        top: 65%;
    }

    .corazon {
        position: absolute;
        color: rgba(255,255,255,0.7);
        font-size: 20px;
        animation: flotar linear infinite;
    }

    @keyframes flotar {
        from {
            transform: translateY(100vh);
        }
        to {
            transform: translateY(-10vh);
        }
    }
</style>
</head>

<body>

<div class="flores">💐🌸🌷🌹</div>
<h1>¿Quieres ser mi San Valentín Sayuri? </h1>

<button id="si">Sí 💖</button>
<button id="no">No 😢</button>

<script>
    const botonNo = document.getElementById("no");
    const botonSi = document.getElementById("si");

    function moverBoton() {
        const ancho = window.innerWidth - 120;
        const alto = window.innerHeight - 120;

        const nuevoX = Math.random() * ancho;
        const nuevoY = Math.random() * alto;

        botonNo.style.left = nuevoX + "px";
        botonNo.style.top = nuevoY + "px";

        botonNo.style.transform = `rotate(${Math.random() * 30}deg)`;
    }

    document.addEventListener("mousemove", (e) => {
        const rect = botonNo.getBoundingClientRect();
        const distanciaX = e.clientX - rect.left;
        const distanciaY = e.clientY - rect.top;
        const distancia = Math.sqrt(distanciaX * distanciaX + distanciaY * distanciaY);

        if (distancia < 150) {
            moverBoton();
        }
    });

    botonNo.addEventListener("mouseover", moverBoton);

    botonSi.addEventListener("click", () => {
        alert("Sabía que dirías que SÍ 💖");
    });

    // Crear corazones flotando
    function crearCorazon() {
        const corazon = document.createElement("div");
        corazon.classList.add("corazon");
        corazon.innerHTML = "💖";
        corazon.style.left = Math.random() * 100 + "vw";
        corazon.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 6000);
    }

    setInterval(crearCorazon, 300);
</script>

</body>
</html>
